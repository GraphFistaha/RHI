name: RHI main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: unixlike-gcc-release
          - os: windows-2022
            preset: windows-msvc-release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3' 'conan>=2.20,<3'

    - name: Initialize MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Detect Conan profile
      run: conan profile detect --force

    # Linux obtains glslc from apt; Windows needs the SDK shader tools.
    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.4.309.0
        cache: true
        stripdown: true

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # install system packages
        sudo apt-get install -y libgl-dev libgl1-mesa-dev \
        libx11-xcb-dev libfontenc-dev libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev libxi-dev \
        libxinerama-dev libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev libxrender-dev libxres-dev libxss-dev libxtst-dev \
        libxv-dev libxxf86vm-dev libxcb-glx0-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev \
        libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev \
        uuid-dev libxcb-cursor-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev libxcb-util0-dev
        #install vulkan libraries
        sudo apt-get install -y libvulkan-dev glslc

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }} -DRHI_BUILD_TESTS=ON -DRHI_BUILD_EXAMPLES=ON

    - name: Build project
      run: cmake --build out/build/${{ matrix.preset }} --parallel 2

    - name: Run tests
      run: ctest --preset test-${{ matrix.preset }}

    - name: Install project
      run: cmake --install out/build/${{ matrix.preset }} --prefix out/install/${{ matrix.preset }}
